name: Build PS4 GoldHEN Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make curl

      - name: Setup OpenOrbis Toolchain
        run: |
          curl -sL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/download/0.0.1.416/toolchain.tar.gz | tar xvz -C .
          echo "OO_PS4_TOOLCHAIN=${GITHUB_WORKSPACE}/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

      - name: Ensure Source File Exists
        run: |
          mkdir -p source
          if [ ! -f source/cyclone2_ds4.c ] && [ -f cyclone2_ds4.c ]; then
            cp cyclone2_ds4.c source/cyclone2_ds4.c
          fi

      - name: Build GoldHEN SDK
        run: |
          make

      - name: Create Plugin Makefile
        run: |
          echo 'TARGET := cyclone2_ds4' > Makefile.plugin
          echo 'OBJS := source/cyclone2_ds4.o' >> Makefile.plugin
          echo 'LIBS := -L. -lGoldHEN_Hook -lSceUsbd -lScePad -lkernel' >> Makefile.plugin
          echo 'EXTRAFLAGS := -Iinclude' >> Makefile.plugin
          echo '' >> Makefile.plugin
          echo 'include $(OO_PS4_TOOLCHAIN)/make/prx.mk' >> Makefile.plugin

      - name: Compile Plugin
        run: |
          make -f Makefile.plugin

      - name: Upload PRX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclone2_ds4_plugin
          path: "*.prx"
