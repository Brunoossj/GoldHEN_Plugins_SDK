name: Build PS4 GoldHEN Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make curl

      - name: Download OpenOrbis Toolchain
        run: |
          mkdir -p $HOME/OO_PS4_TOOLCHAIN
          curl -sSL "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C $HOME/OO_PS4_TOOLCHAIN --strip-components=1 || tar -xzf toolchain.tar.gz -C $HOME/OO_PS4_TOOLCHAIN
          chmod +x $HOME/OO_PS4_TOOLCHAIN/bin/* 2>/dev/null || true

      - name: Create Plugin Makefile
        run: |
          export OO_PS4_TOOLCHAIN=$HOME/OO_PS4_TOOLCHAIN
          echo "TARGET := cyclone2_ds4" > Makefile.plugin
          echo "OBJS := source/cyclone2_ds4.o" >> Makefile.plugin
          echo "LIBS := -lGoldHEN_Hook -lSceUsbd -lScePad -lkernel" >> Makefile.plugin
          echo "" >> Makefile.plugin
          echo "include \$(OO_PS4_TOOLCHAIN)/make/prx.mk" >> Makefile.plugin

      - name: Compile Plugin
        run: |
          export OO_PS4_TOOLCHAIN=$HOME/OO_PS4_TOOLCHAIN
          make -f Makefile.plugin

      - name: Upload PRX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclone2_ds4_plugin
          path: "*.prx"
